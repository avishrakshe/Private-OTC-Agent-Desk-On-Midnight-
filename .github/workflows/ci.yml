name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Typecheck, test & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Verify compiled contract is present
        run: test -f contracts/managed/private-otc-desk/contract/index.js

      - name: Typecheck (site, protocol, scripts, tests)
        run: npm run typecheck

      - name: Protocol tests against the compiled Compact circuits
        run: npm test

      - name: Build web application
        run: npm run build

name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Build & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm install

      - name: Verify managed ZK contract assets present
        run: ls -la contracts/managed/private-otc-desk

      - name: Run Private OTC Agent Desk Unit Tests (Circuit Logic, State Transitions, Privacy)
        run: npm test

      - name: Build Web Application
        run: npm run build
